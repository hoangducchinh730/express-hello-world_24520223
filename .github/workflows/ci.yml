name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME sử dụng tên repo
  IMAGE_NAME: ${{ github.repository_owner }}/express-hello-world

jobs:
  # ============================================================================
  # JOB 1: DEPENDENCIES & TEST
  # ============================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ============================================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ============================================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    # Chỉ build image và push khi code được merge/push vào nhánh main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3: NOTIFICATION
  # ============================================================================
  notify:
    name: Send Notification
    needs: [build-and-test, build-and-push]
    # always() đảm bảo job này luôn chạy kể cả khi các job trước thất bại
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print Pipeline Status
        run: |
          echo "========================================="
          echo "Trạng thái Pipeline cho ${{ github.repository }}:"
          echo " - Build & Test: ${{ needs.build-and-test.result }}"
          echo " - Build Docker: ${{ needs.build-and-push.result }}"
          echo "========================================="
          if [ "${{ needs.build-and-test.result }}" = "success" ] && [ "${{ needs.build-and-push.result }}" = "success" ] || [ "${{ needs.build-and-push.result }}" = "skipped" ]; then
            echo "✅ Pipeline hoàn thành xuất sắc!"
          else
            echo "❌ Pipeline có lỗi xảy ra. Vui lòng kiểm tra lại GitHub Actions logs!"
            exit 1
          fi
